name: Publish on GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least-privilege token, plus what the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time. Never cancel a publish half-way — let it finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `lastUpdated: true` in the VitePress config reads each page's git timestamp,
          # so the full history has to be present.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        env:
          NODE_ENV: production

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # `docs:build` fails on dead links by design — a broken cross-reference stops the publish.
      - name: Build the site
        run: bun run docs:build

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
